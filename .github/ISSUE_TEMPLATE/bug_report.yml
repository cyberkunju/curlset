name: Bug report
description: Something behaves incorrectly or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, private datasets or exploit details here — see SECURITY.md for sensitive reports.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release tag
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / ingestion
        - Labeling / review
        - Generation (text)
        - Image generation
        - Object detection / proposals
        - Ensemble / auto-labeling
        - Versioning / export
        - UI
        - API / security
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact commands or clicks, in order
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Redact keys, paths with personal data and dataset contents
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have read docs/STATUS.md known limitations
          required: true
        - label: This report contains no secrets or private data
          required: true
