name: Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check docs/ROADMAP.md first — the item may already be planned. Product scope rules live in docs/REQUIREMENTS.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Observable behaviour, not implementation details
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / ingestion
        - Labeling / review
        - Generation
        - Image generation
        - Object detection
        - Ensemble / auto-labeling
        - Versioning / export
        - UI / UX
        - Architecture / operations
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or research
      description: Measured numbers, a research file under docs/research/, or a concrete example
    validations:
      required: false
  - type: checkboxes
    id: honesty
    attributes:
      label: Honesty check
      options:
        - label: This request does not claim accuracy/legal guarantees the project cannot verify
          required: true
