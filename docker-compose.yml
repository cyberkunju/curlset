version: '3.8'

# This Compose file reproduces the SUPPORTED local configuration:
# single API process (in-process jobs), React web build served by Nginx,
# SQLite metadata and local filesystem storage on a named volume.
# PostgreSQL, Redis, S3 and a separate worker are NOT wired; see docs/ROADMAP.md.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: curlset-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: sqlite:////app/data/curlset.db
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/data/storage
      WORKER_MODE: inline
      PRIVACY_MODE: ${PRIVACY_MODE:-local_only}
      SECRET_KEY: ${SECRET_KEY:-insecure-default-change-me-in-production}
      ALLOW_SIMULATED_PROVIDERS: ${ALLOW_SIMULATED_PROVIDERS:-false}
      ENABLE_LIVE_IMAGE_PROVIDERS: ${ENABLE_LIVE_IMAGE_PROVIDERS:-false}
    volumes:
      - platform_data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: curlset-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  platform_data:
    name: curlset_platform_data
