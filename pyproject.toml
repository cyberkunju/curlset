[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dataset-engineering-platform"
version = "0.1.0"
description = "Multimodal dataset engineering platform for acquiring, labeling, reviewing, validating, versioning, and exporting training datasets."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Platform Maintainers" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "httpx>=0.28.0"
]

[project.optional-dependencies]
# Dataset-local specialist: linear probe over frozen embeddings. Optional so the core platform
# keeps its current dependency footprint; the code raises a clear error when it is absent.
specialist = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]
# Sentence encoder used to produce the embeddings the specialist probes. Pulls in torch, so it is
# deliberately separate from `specialist`.
embeddings = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["B008"]

